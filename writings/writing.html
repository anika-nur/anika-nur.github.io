<script src="../writings-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../likes.js"></script>
<script>
  const id = new URLSearchParams(window.location.search).get('id');
  const writing = writingsData.find(w => w.id === id);
  const content = document.getElementById('writingContent');

  if (writing) {
    document.getElementById('pageTitle').textContent = `${writing.title} — Nur's Utopia`;
    content.innerHTML = `
      <header class="writing-page-header">
        <p class="writing-genre">${writing.genre}</p>
        <h1 class="writing-page-title">${writing.title}</h1>
        <div class="section-ornament" style="margin-top:1.25rem;">✦ · ✦ · ✦</div>
        <div style="margin-top:1.5rem; display:flex; justify-content:center;">
          <button class="like-star-btn like-star-btn-lg" data-like-id="writing:${writing.id}" type="button" aria-pressed="false" aria-label="Star this piece" disabled>
            <svg class="like-star-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 L14.9 9.1 L22 9.9 L16.7 14.6 L18.2 21.6 L12 18 L5.8 21.6 L7.3 14.6 L2 9.9 L9.1 9.1 Z"/></svg>
            <span class="like-star-count">·</span>
          </button>
        </div>
      </header>
      <div class="prose${writing.poem ? ' poem' : ''}">
        ${writing.body.map(p => `<p>${p.replace(/\n/g, '<br>\n')}</p>`).join('')}
      </div>
    `;
    if (window.initLikeButtons) initLikeButtons();
  } else {
    content.innerHTML = `
      <header class="writing-page-header">
        <h1 class="writing-page-title">Writing not found</h1>
      </header>
      <div class="prose"><p>That piece doesn't seem to exist. <a href="index.html" class="writing-link">Back to all writings →</a></p></div>
    `;
  }

  const container = document.getElementById('particles');
  const colours = ['#b4c2d4','#c4948a','#9eb08c','#c9a96e','#f0e5d0'];
  for (let i = 0; i < 22; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 4 + 2;
    p.style.cssText = `
      width:${size}px; height:${size}px;
      background:${colours[Math.floor(Math.random()*colours.length)]};
      left:${Math.random()*100}%;
      animation-duration:${Math.random()*18+12}s;
      animation-delay:${Math.random()*-20}s;
    `;
    container.appendChild(p);
  }

  const ham = document.getElementById('hamburger');
  const navLinks = document.getElementById('navLinks');
  ham.addEventListener('click', () => navLinks.classList.toggle('open'));
  navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => navLinks.classList.remove('open')));
</script>

</body>
