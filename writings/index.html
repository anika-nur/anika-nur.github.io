<script>
  function likeButtonHtml(likeId, big) {
    return `
      <button class="like-star-btn${big ? ' like-star-btn-lg' : ''}" data-like-id="${likeId}" type="button" aria-pressed="false" aria-label="Star this piece" disabled>
        <svg class="like-star-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 L14.9 9.1 L22 9.9 L16.7 14.6 L18.2 21.6 L12 18 L5.8 21.6 L7.3 14.6 L2 9.9 L9.1 9.1 Z"/></svg>
        <span class="like-star-count">·</span>
      </button>
    `;
  }

  function flourishFor(genre) {
    const flourishes = {
      'Poetry': `<circle cx="60" cy="60" r="40" stroke="#b8aad4" stroke-width="0.8" fill="none" stroke-dasharray="4 6"/>`,
      'Essay': `<path d="M60 10 Q20 60 60 110 Q100 60 60 10Z" stroke="#c9a96e" stroke-width="1" fill="none"/>`
    };
    return flourishes[genre] || `<path d="M20 100 Q60 20 100 80 Q80 40 40 60" stroke="#6e5f82" stroke-width="1" fill="none"/>`;
  }

  /* cards with an unusually long excerpt span two grid columns instead of
     stretching their row-mates to match their height */
  const WIDE_EXCERPT_THRESHOLD = 300;
  const wideClass = text => text.length > WIDE_EXCERPT_THRESHOLD ? ' card-wide' : '';

  const archive = document.getElementById('writingsArchive');
  archive.innerHTML = writingsData.map(w => `
    <article class="writing-card reveal${wideClass(w.excerpt)}">
      <svg class="ink-flourish" width="120" height="120" viewBox="0 0 120 120" fill="none" aria-hidden="true">
        ${flourishFor(w.genre)}
      </svg>
      <p class="writing-genre">${w.genre}</p>
      <h3 class="writing-title">${w.title}</h3>
      <p class="writing-excerpt">"${w.excerpt}"</p>
      <div class="card-footer-row">
        <a href="writing.html?id=${w.id}" class="writing-link">Read more →</a>
        ${likeButtonHtml('writing:' + w.id)}
      </div>
    </article>
  `).join('');

  const container = document.getElementById('particles');
  const colours = ['#b4c2d4','#c4948a','#9eb08c','#c9a96e','#f0e5d0'];
  for (let i = 0; i < 22; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 4 + 2;
    p.style.cssText = `
      width:${size}px; height:${size}px;
      background:${colours[Math.floor(Math.random()*colours.length)]};
      left:${Math.random()*100}%;
      animation-duration:${Math.random()*18+12}s;
      animation-delay:${Math.random()*-20}s;
    `;
    container.appendChild(p);
  }

  const ham = document.getElementById('hamburger');
  const navLinks = document.getElementById('navLinks');
  ham.addEventListener('click', () => navLinks.classList.toggle('open'));
  navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => navLinks.classList.remove('open')));

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

  if (window.initLikeButtons) initLikeButtons();
</script>
