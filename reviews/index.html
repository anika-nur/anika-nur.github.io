<script src="../reviews-data.js"></script>
<script>
  /* cards with an unusually long excerpt span two grid columns instead of
     stretching their row-mates to match their height */
  const WIDE_EXCERPT_THRESHOLD = 300;
  const wideClass = text => text.length > WIDE_EXCERPT_THRESHOLD ? ' card-wide' : '';

  const archive = document.getElementById('reviewsArchive');
  archive.innerHTML = reviewsData.map(r => `
    <article class="review-card reveal${wideClass(r.excerpt)}">
      <span class="review-emoji">${r.type === 'TV Show' ? '📺' : '🎬'}</span>
      <p class="writing-genre">${r.type}</p>
      <h3 class="review-card-title">${r.title}</h3>
      <p class="review-author">${r.creator}</p>
      <div class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(5 - r.stars)}</div>
      <p class="review-text">"${r.excerpt}"</p>
      <a href="review.html?id=${r.id}" class="writing-link">Read more →</a>
    </article>
  `).join('');

  const container = document.getElementById('particles');
  const colours = ['#b4c2d4','#c4948a','#9eb08c','#c9a96e','#f0e5d0'];
  for (let i = 0; i < 22; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 4 + 2;
    p.style.cssText = `
      width:${size}px; height:${size}px;
      background:${colours[Math.floor(Math.random()*colours.length)]};
      left:${Math.random()*100}%;
      animation-duration:${Math.random()*18+12}s;
      animation-delay:${Math.random()*-20}s;
    `;
    container.appendChild(p);
  }

  const ham = document.getElementById('hamburger');
  const navLinks = document.getElementById('navLinks');
  ham.addEventListener('click', () => navLinks.classList.toggle('open'));
  navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => navLinks.classList.remove('open')));

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>
