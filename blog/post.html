<body>

<div class="particles" id="particles"></div>

<!-- ═══════ NAV ═══════ -->

        <path d="M11 2 C11 2, 6 6, 6 11 C6 14.3 8.2 17 11 18 C13.8 17 16 14.3 16 11 C16 6 11 2 11 2Z" stroke="#9e7840" stroke-width="1.2" fill="rgba(201,169,110,0.15)"/>
        <circle cx="11" cy="11" r="2.5" stroke="#9e7840" stroke-width="1" fill="rgba(214,205,232,0.5)"/>

<!-- ═══════ POST PAGE ═══════ -->
<main class="writing-page-wrap">
  <!-- corner moon + star -->
  <svg style="position:absolute;top:3.5rem;right:-0.5rem;opacity:0.22;pointer-events:none" width="52" height="60" viewBox="0 0 52 60" fill="none" aria-hidden="true">
    <path d="M32 8 C20 10 12 20 14 32 C16 44 27 52 38 48 C28 50 16 42 16 30 C16 18 26 10 38 12 C36 10 34 8 32 8Z" fill="#b4c2d4" fill-opacity="0.7" stroke="#b4c2d4" stroke-width="0.6"/>
    <circle cx="10" cy="18" r="2" fill="#c9a96e" fill-opacity="0.7"/>
    <circle cx="44" cy="28" r="1.5" fill="#c9a96e" fill-opacity="0.6"/>
    <path d="M20 52 L21 55 L24 56 L21 57 L20 60 L19 57 L16 56 L19 55Z" fill="#c9a96e" fill-opacity="0.6"/>
  </svg>

  <a href="index.html" class="back-link">← Back to Blog</a>

  <article class="writing-page" id="postContent">
    <!-- populated by JS from blog-data.js based on the ?id= in the URL -->
  </article>
</main>

<!-- ═══════ FOOTER ═══════ -->
<footer>
  <svg width="60" height="45" viewBox="0 0 60 45" fill="none" style="margin-bottom:1.25rem; opacity:0.5" aria-hidden="true">
    <ellipse cx="30" cy="30" rx="18" ry="10" stroke="#b8aad4" stroke-width="0.8" fill="rgba(184,170,212,0.1)"/>
    <ellipse cx="30" cy="22" rx="12" ry="11" stroke="#b8aad4" stroke-width="0.8" fill="rgba(184,170,212,0.15)"/>
    <path d="M20 16 L15 5 L26 14Z" stroke="#b8aad4" stroke-width="0.8" fill="rgba(184,170,212,0.2)"/>
    <path d="M40 16 L45 5 L34 14Z" stroke="#b8aad4" stroke-width="0.8" fill="rgba(184,170,212,0.2)"/>
    <circle cx="24" cy="21" r="2.5" fill="#2c2535"/>
    <circle cx="36" cy="21" r="2.5" fill="#2c2535"/>
    <circle cx="25" cy="20" r="1" fill="white" opacity="0.7"/>
    <circle cx="37" cy="20" r="1" fill="white" opacity="0.7"/>
    <path d="M48 28 Q58 22 60 14 Q58 8 52 12" stroke="#b8aad4" stroke-width="0.8" fill="none"/>
  </svg>

  <p class="footer-title">Nur's Utopia</p>
  <p class="footer-tagline">where stories live and code breathes</p>

  <div class="footer-links">
    <a href="../index.html">Home</a>
    <a href="../projects/index.html">Projects</a>
    <a href="../writings/index.html">Writings</a>
    <a href="index.html">Blog</a>
    <a href="../index.html#reviews">Reviews</a>
    <a href="../index.html#contact">Contact</a>
  </div>

  <p class="footer-copy">crafted with ✦ and refreshing sips of Iced Dulce Latte</p>
</footer>

<script src="../blog-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../likes.js"></script>
<script>
  const id = new URLSearchParams(window.location.search).get('id');
  const post = blogData.find(p => p.id === id);
  const content = document.getElementById('postContent');

  if (post) {
    document.getElementById('pageTitle').textContent = `${post.title} -- Nur's Utopia`;
    content.innerHTML = `
      <header class="writing-page-header">
        <p class="writing-genre">${post.month} ${post.day}</p>
        <h1 class="writing-page-title">${post.title}</h1>
        <div class="blog-tags" style="justify-content:center; margin-top:1rem;">
          ${post.tags.map(t => `<span class="blog-tag">${t}</span>`).join('')}
        </div>
        <div class="section-ornament" style="margin-top:1.25rem;">✦ · ✦ · ✦</div>
        <div style="margin-top:1.5rem; display:flex; justify-content:center;">
          <button class="like-star-btn like-star-btn-lg" data-like-id="blog:${post.id}" type="button" aria-pressed="false" aria-label="Star this post" disabled>
            <svg class="like-star-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 L14.9 9.1 L22 9.9 L16.7 14.6 L18.2 21.6 L12 18 L5.8 21.6 L7.3 14.6 L2 9.9 L9.1 9.1 Z"/></svg>
            <span class="like-star-count">·</span>
          </button>
        </div>
      </header>
      <div class="prose">
        ${post.body.map(p => `<p>${p}</p>`).join('')}
      </div>
    `;
    if (window.initLikeButtons) initLikeButtons();
  } else {
    content.innerHTML = `
      <header class="writing-page-header">
        <h1 class="writing-page-title">Post not found</h1>
      </header>
      <div class="prose"><p>That post doesn't seem to exist. <a href="index.html" class="writing-link">Back to all posts →</a></p></div>
    `;
  }

  const container = document.getElementById('particles');
  const colours = ['#b4c2d4','#c4948a','#9eb08c','#c9a96e','#f0e5d0'];
  for (let i = 0; i < 22; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 4 + 2;
    p.style.cssText = `
      width:${size}px; height:${size}px;
      background:${colours[Math.floor(Math.random()*colours.length)]};
      left:${Math.random()*100}%;
      animation-duration:${Math.random()*18+12}s;
      animation-delay:${Math.random()*-20}s;
    `;
    container.appendChild(p);
  }

  const ham = document.getElementById('hamburger');
  const navLinks = document.getElementById('navLinks');
  ham.addEventListener('click', () => navLinks.classList.toggle('open'));
  navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => navLinks.classList.remove('open')));
</script>

</body>
</html>
