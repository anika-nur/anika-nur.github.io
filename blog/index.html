<script src="../likes.js"></script>
<script>
  function likeButtonHtml(likeId, big) {
    return `
      <button class="like-star-btn${big ? ' like-star-btn-lg' : ''}" data-like-id="${likeId}" type="button" aria-pressed="false" aria-label="Star this piece" disabled>
        <svg class="like-star-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 L14.9 9.1 L22 9.9 L16.7 14.6 L18.2 21.6 L12 18 L5.8 21.6 L7.3 14.6 L2 9.9 L9.1 9.1 Z"/></svg>
        <span class="like-star-count">·</span>
      </button>
    `;
  }

  const archive = document.getElementById('blogArchive');
  archive.innerHTML = blogData.map(p => `
    <div class="blog-post reveal">
      <div class="blog-date-col">
        <span class="blog-month">${p.month}</span>
        <span class="blog-day">${p.day}</span>
      </div>
      <div>
        <a href="post.html?id=${p.id}" class="blog-post-title">${p.title}</a>
        <div class="blog-tags">
          ${p.tags.map(t => `<span class="blog-tag">${t}</span>`).join('')}
        </div>
        <p class="blog-excerpt">${p.excerpt}</p>
        <div class="card-footer-row">
          <a href="post.html?id=${p.id}" class="writing-link">Read more →</a>
          ${likeButtonHtml('blog:' + p.id)}
        </div>
      </div>
    </div>
  `).join('');

  const container = document.getElementById('particles');
  const colours = ['#b4c2d4','#c4948a','#9eb08c','#c9a96e','#f0e5d0'];
  for (let i = 0; i < 22; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 4 + 2;
    p.style.cssText = `
      width:${size}px; height:${size}px;
      background:${colours[Math.floor(Math.random()*colours.length)]};
      left:${Math.random()*100}%;
      animation-duration:${Math.random()*18+12}s;
      animation-delay:${Math.random()*-20}s;
    `;
    container.appendChild(p);
  }

  const ham = document.getElementById('hamburger');
  const navLinks = document.getElementById('navLinks');
  ham.addEventListener('click', () => navLinks.classList.toggle('open'));
  navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => navLinks.classList.remove('open')));

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

  if (window.initLikeButtons) initLikeButtons();
</script>
