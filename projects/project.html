<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Project — Nur's Utopia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Crimson+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<svg class="grain-overlay" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><filter id="grain-f" x="0%" y="0%" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.70 0.52" numOctaves="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#grain-f)"/></svg>

<div class="particles" id="particles"></div>

<!-- ═══════ NAV ═══════ -->
<nav>
  <div class="nav-inner">
    <a class="nav-logo" href="../index.html">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
        <path d="M11 2 C11 2, 6 6, 6 11 C6 14.3 8.2 17 11 18 C13.8 17 16 14.3 16 11 C16 6 11 2 11 2Z" stroke="#9e7840" stroke-width="1.2" fill="rgba(201,169,110,0.15)"/>
        <circle cx="11" cy="11" r="2.5" stroke="#9e7840" stroke-width="1" fill="rgba(214,205,232,0.5)"/>
        <path d="M5 8 Q11 4 17 8" stroke="#b8aad4" stroke-width="0.8" fill="none"/>
      </svg>
      Nur's Utopia
    </a>
    <ul class="nav-links" id="navLinks">
      <li><a href="../index.html">Home</a></li>
      <li><a href="index.html">Projects</a></li>
      <li><a href="../writings/index.html">Writings</a></li>
      <li><a href="../blog/index.html">Blog</a></li>
      <li><a href="../index.html#reviews">Reviews</a></li>
      <li><a href="../index.html#contact">Contact</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- ═══════ PROJECT PAGE ═══════ -->
<main class="writing-page-wrap">
  <!-- corner atom -->
  <svg style="position:absolute;top:3.5rem;right:-0.5rem;opacity:0.2;pointer-events:none" width="52" height="52" viewBox="0 0 52 52" fill="none" aria-hidden="true">
    <circle cx="26" cy="26" r="5" fill="rgba(180,194,212,0.5)" stroke="#b4c2d4" stroke-width="0.9"/>
    <ellipse cx="26" cy="26" rx="22" ry="8" stroke="#b4c2d4" stroke-width="0.9" fill="none"/>
    <ellipse cx="26" cy="26" rx="22" ry="8" stroke="#b4c2d4" stroke-width="0.9" fill="none" transform="rotate(60 26 26)"/>
    <ellipse cx="26" cy="26" rx="22" ry="8" stroke="#b4c2d4" stroke-width="0.9" fill="none" transform="rotate(-60 26 26)"/>
  </svg>

  <a href="index.html" class="back-link">← Back to Projects</a>

  <article class="writing-page" id="projectContent">
    <!-- populated by JS from projects-data.js based on the ?id= in the URL -->
  </article>
</main>

<!-- ═══════ FOOTER ═══════ -->
<footer>
  <svg width="60" height="45" viewBox="0 0 60 45" fill="none" style="margin-bottom:1.25rem; opacity:0.5" aria-hidden="true">
    <ellipse cx="30" cy="30" rx="18" ry="10" stroke="#b8aad4" stroke-width="0.8" fill="rgba(184,170,212,0.1)"/>
    <ellipse cx="30" cy="22" rx="12" ry="11" stroke="#b8aad4" stroke-width="0.8" fill="rgba(184,170,212,0.15)"/>
    <path d="M20 16 L15 5 L26 14Z" stroke="#b8aad4" stroke-width="0.8" fill="rgba(184,170,212,0.2)"/>
    <path d="M40 16 L45 5 L34 14Z" stroke="#b8aad4" stroke-width="0.8" fill="rgba(184,170,212,0.2)"/>
    <circle cx="24" cy="21" r="2.5" fill="#2c2535"/>
    <circle cx="36" cy="21" r="2.5" fill="#2c2535"/>
    <circle cx="25" cy="20" r="1" fill="white" opacity="0.7"/>
    <circle cx="37" cy="20" r="1" fill="white" opacity="0.7"/>
    <path d="M48 28 Q58 22 60 14 Q58 8 52 12" stroke="#b8aad4" stroke-width="0.8" fill="none"/>
  </svg>

  <p class="footer-title">Nur's Utopia</p>
  <p class="footer-tagline">where stories live and code breathes</p>

  <div class="footer-links">
    <a href="../index.html">Home</a>
    <a href="index.html">Projects</a>
    <a href="../writings/index.html">Writings</a>
    <a href="../blog/index.html">Blog</a>
    <a href="../index.html#reviews">Reviews</a>
    <a href="../index.html#contact">Contact</a>
  </div>

  <p class="footer-copy">crafted with ✦ and a great deal of tea · 2025</p>
</footer>

<script src="../projects-data.js"></script>
<script>
  const id = new URLSearchParams(window.location.search).get('id');
  const project = projectsData.find(p => p.id === id);
  const content = document.getElementById('projectContent');

  if (project) {
    document.getElementById('pageTitle').textContent = `${project.title} — Nur's Utopia`;

    const linksHtml = (project.github || project.live) ? `
      <div class="project-links" style="margin-top:2rem;">
        ${project.github ? `<a href="${project.github}" target="_blank" rel="noopener" class="project-link-btn">⌥ View on GitHub</a>` : ''}
        ${project.live ? `<a href="${project.live}" target="_blank" rel="noopener" class="project-link-btn live">↗ Live demo</a>` : ''}
      </div>
    ` : '';

    const filesHtml = (project.files && project.files.length) ? `
      <div class="project-files">
        <p class="project-files-label">Files &amp; Resources</p>
        <ul class="project-file-list">
          ${project.files.map(f => `
            <li>
              <a href="${f.url}" target="_blank" rel="noopener" class="project-file-link">
                <svg width="14" height="16" viewBox="0 0 14 16" fill="none" aria-hidden="true">
                  <path d="M2 1h7l3 3v11H2V1z" stroke="#6e5f82" stroke-width="1" fill="none" stroke-linejoin="round"/>
                  <path d="M9 1v3h3" stroke="#6e5f82" stroke-width="1" fill="none"/>
                </svg>
                ${f.name}
              </a>
            </li>
          `).join('')}
        </ul>
      </div>
    ` : '';

    content.innerHTML = `
      <header class="writing-page-header">
        <p class="writing-genre">${project.type}</p>
        <h1 class="writing-page-title">${project.title}</h1>
        <div class="blog-tags" style="justify-content:center; margin-top:1rem;">
          ${project.tags.map(t => `<span class="blog-tag">${t}</span>`).join('')}
        </div>
        <div class="section-ornament" style="margin-top:1.25rem;">✦ · ✦ · ✦</div>
      </header>
      <div class="prose">
        ${project.readme.map(p => `<p>${p}</p>`).join('')}
      </div>
      ${linksHtml}
      ${filesHtml}
    `;
  } else {
    content.innerHTML = `
      <header class="writing-page-header">
        <h1 class="writing-page-title">Project not found</h1>
      </header>
      <div class="prose"><p>That project doesn't seem to exist. <a href="index.html" class="writing-link">Back to all projects →</a></p></div>
    `;
  }

  const container = document.getElementById('particles');
  const colours = ['#b4c2d4','#c4948a','#9eb08c','#c9a96e','#f0e5d0'];
  for (let i = 0; i < 22; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 4 + 2;
    p.style.cssText = `
      width:${size}px; height:${size}px;
      background:${colours[Math.floor(Math.random()*colours.length)]};
      left:${Math.random()*100}%;
      animation-duration:${Math.random()*18+12}s;
      animation-delay:${Math.random()*-20}s;
    `;
    container.appendChild(p);
  }

  const ham = document.getElementById('hamburger');
  const navLinks = document.getElementById('navLinks');
  ham.addEventListener('click', () => navLinks.classList.toggle('open'));
  navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => navLinks.classList.remove('open')));
</script>

</body>
</html>
